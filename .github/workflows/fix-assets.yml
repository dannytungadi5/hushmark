name: fix-assets
on:
  push:
    paths: ['.github/workflows/fix-assets.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd public
          for f in apple-touch-icon favicon-32 icon-192 icon-512; do git mv -f [0-9]-$f.png $f.png; done
          git config user.name "danny tungadi"
          git config user.email "dannytungadi5@users.noreply.github.com"
          git commit -am "Fix asset names"
          git push
